title: "Five verbs — İskele · Mizan · Kıyas · ux-mizan · Röntgen"
description: "Five Claude skills that keep each other honest: one builds the structure, one weighs the claims, one generates the candidates, one measures the experience, one maps what already exists. Bilingual EN/TR, English first."
lang: en

# No gem theme: the page ships its own layout in _layouts/default.html. A theme
# would decide the typography and the dark mode for us, and this page has four
# accents and two languages to keep in agreement -- cheaper to own outright than
# to override.
#
# No `plugins:` key either: setting one REPLACES the GitHub Pages default set
# rather than adding to it, and those defaults are what make ordinary Markdown
# behave the way every page here assumes.

# Repository tooling, not pages. Jekyll would otherwise publish the checker
# as a static file next to the site.
exclude:
  - tools/
