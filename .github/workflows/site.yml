name: Site checks

on:
  push:
  pull_request:
  # A release in any of the four repositories changes what "latest" means
  # without touching this one, so the table is also re-read daily.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The release table says what GitHub Releases says
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_releases.py

      - name: Self-test — a stale row is caught
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp index.md /tmp/index-backup
          # Rewrite the first version shown beside a /releases/latest link.
          python - <<'PY'
          import re, io
          t = io.open("index.md", encoding="utf-8").read()
          t = re.sub(r'(/releases/latest">[^<]*</a></td>\s*<td><strong>)[^<]+', r'\g<1>v0.0.1', t, count=1)
          io.open("index.md", "w", encoding="utf-8").write(t)
          PY
          if python tools/check_releases.py; then
            cp /tmp/index-backup index.md
            echo "FAIL: a stale version went unnoticed" >&2; exit 1
          fi
          cp /tmp/index-backup index.md
          echo "ok -- a stale row is caught"

  family-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The four repositories share one copy of their shared tools
        run: python tools/check_family_tools.py

  rule-health:
    # Which R/G/U rules have ever fired on what the family actually wrote.
    # A report, not a gate: it never fails the run. Full history is needed,
    # so each repository is cloned with fetch-depth 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Clone the four repositories with full history
        run: |
          set -e
          mkdir -p /tmp/family
          for r in Mizan Kiyas Iskele ux-mizan; do
            git clone --quiet --no-single-branch https://github.com/XINMurat/$r.git /tmp/family/$r
          done
      - name: Rule health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/rule_health.py --root /tmp/family --consumers --json /tmp/rule-health.json
      - uses: actions/upload-artifact@v4
        with:
          name: rule-health
          path: /tmp/rule-health.json
          retention-days: 90
